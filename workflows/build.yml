name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Подстраховка: ставим нужные части Android SDK. Если шаг не удался, Gradle докачает их сам.
      - name: Android SDK packages
        continue-on-error: true
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Restore signing key
        run: |
          if [ -f keystore/yournix.p12.b64 ]; then
            base64 -d keystore/yournix.p12.b64 > keystore/yournix.p12
            echo "Signing key restored"
          else
            echo "No signing key in the repo, the debug key will be used"
          fi

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Yournix.apk
          ls -l Yournix.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Yournix-apk
          path: Yournix.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" Yournix.apk \
            --title "Yournix 1.0.${{ github.run_number }}" \
            --notes "Скачайте Yournix.apk и установите на телефон (Android 8.0 и новее)." \
            --target "${{ github.sha }}"
          {
            echo "### Yournix.apk готов"
            echo ""
            echo "Скачать: https://github.com/${{ github.repository }}/releases/latest/download/Yournix.apk"
          } >> "$GITHUB_STEP_SUMMARY"
